[project]
name = "rlog"
version = "1.0.1"
description = "A simple logger for reinforcement learning."
readme = { file = "README.MD", content-type = "text/markdown" }
authors = [{ name = "Florin Gogianu", email = "florin.gogianu@gmail.com" }]
keywords = ["logging", "machine learning", "reinforcement learning"]
requires-python = ">=3.11"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Logging",
]
dependencies = ["termcolor>=3.1.0"]

[project.optional-dependencies]
tensorboard = ["tensorboard>=2.16", "torch>=2.0"]

[project.urls]
Homepage = "https://github.com/floringogianu/rlog"
Issues = "https://github.com/floringogianu/rlog/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# --- build ------------------------------------------------------------------
# Explicit, so build backends never guess. Without this, flat-layout
# auto-discovery also picks up `sota_results/` and `tests/`.

[tool.hatch.build.targets.wheel]
packages = ["src/rlog"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "README.MD", "CHANGELOG.md"]

# --- dev --------------------------------------------------------------------

[dependency-groups]
dev = ["commitizen>=4.8", "pytest>=8.0.0", "ruff>=0.12"]
play = ["ipython"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
# pycodestyle, Pyflakes, pyupgrade, flake8-bugbear, flake8-simplify, isort
select = ["E", "F", "UP", "B", "SIM", "I"]
ignore = [
    "UP032", # use f-string instead of `format` call
]

[tool.basedpyright]
pythonVersion = "3.11"
pythonPlatform = "All"
typeCheckingMode = "standard"

[tool.commitizen]
name = "cz_conventional_commits"
# Reads and writes `[project] version` directly. One number, one place.
version_provider = "pep621"
tag_format = "v$version"
update_changelog_on_bump = true
